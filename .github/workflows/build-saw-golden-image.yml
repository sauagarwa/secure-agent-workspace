name: Build SAW golden VM image

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name; must match metadata.name in the selected BOM"
        required: true
        type: string
      bom:
        description: "InstallerBOM path"
        required: true
        default: examples/saw/installer-bom.yaml
        type: string

permissions:
  contents: read

concurrency:
  group: saw-golden-image-${{ inputs.release_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build candidate golden image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: saw-golden-image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate selected BOM
        id: release
        env:
          RELEASE: ${{ inputs.release_name }}
          BOM: ${{ inputs.bom }}
        run: |
          set -euo pipefail
          test -f "$BOM"
          bom_name="$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["metadata"]["name"])' "$BOM")"
          test "$bom_name" = "$RELEASE" || {
            echo "BOM metadata.name ($bom_name) must match release name ($RELEASE)." >&2
            exit 1
          }
          echo "bom=$BOM" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate allowlisted image build context
        env:
          BOM: ${{ steps.release.outputs.bom }}
        run: |
          set -euo pipefail
          python tools/saw/build_image_context.py \
            --installer-bom "$BOM" \
            --output "$RUNNER_TEMP/saw-image-context"

      - name: Install OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      - name: Log in to OpenShift
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_CA_BUNDLE: ${{ secrets.OPENSHIFT_CA_BUNDLE }}
        run: |
          set -euo pipefail
          test -n "$OPENSHIFT_SERVER"
          test -n "$OPENSHIFT_TOKEN"
          test -n "$OPENSHIFT_CA_BUNDLE"
          ca_file="$RUNNER_TEMP/openshift-ca.crt"
          printf '%s\n' "$OPENSHIFT_CA_BUNDLE" > "$ca_file"
          oc login "$OPENSHIFT_SERVER" \
            --token="$OPENSHIFT_TOKEN" \
            --certificate-authority="$ca_file"
          oc whoami

      - name: Start isolated OpenShift image build
        env:
          SAW_IMAGE_BUILD_NAMESPACE: saw-installer-validation
        run: |
          set -euo pipefail
          make saw-image-build \
            SAW_IMAGE_CONTEXT="$RUNNER_TEMP/saw-image-context" \
            SAW_IMAGE_BUILD_NAMESPACE="$SAW_IMAGE_BUILD_NAMESPACE" \
            | tee "$RUNNER_TEMP/image-build.log"

      - name: Capture candidate image digest
        id: image
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          namespace=saw-installer-validation
          build_name="$(oc get build -n "$namespace" \
            -l buildconfig=saw-installer \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')"
          digest="$(oc get build "$build_name" -n "$namespace" -o jsonpath='{.status.output.to.imageDigest}')"
          repository="$(oc get imagestream saw-installer -n "$namespace" -o jsonpath='{.status.dockerImageRepository}')"
          test -n "$digest"
          test -n "$repository"
          image_ref="$repository@$digest"
          {
            echo "release=$RELEASE"
            echo "buildName=$build_name"
            echo "imageRef=$image_ref"
            echo "imageDigest=$digest"
            echo "namespace=$namespace"
          } | tee "$RUNNER_TEMP/saw-golden-image-release.txt"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Upload candidate metadata
        uses: actions/upload-artifact@65462800fd7603441b7a4382951275a0abb480 # v4.3.3
        with:
          name: saw-golden-image-${{ steps.release.outputs.release }}
          path: |
            ${{ runner.temp }}/saw-golden-image-release.txt
            ${{ runner.temp }}/image-build.log
            ${{ runner.temp }}/saw-image-context/build-inputs.json

      - name: Print promotion instructions
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          echo "Candidate image: $IMAGE_REF"
          echo "Complete smoke, scan, signature, and approval gates before publishing it in sawBlueprint.goldenImages[].registryURL."
          echo "The workflow intentionally does not create the production CDI DataSource."
