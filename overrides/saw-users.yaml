# Add real account names here after creating them with keycloak-add-users.
# Each entry creates saw-<name>. Demo entries are in saw-users-demo.yaml.
#
# Alice is back on the VM backend. Keep the credential base scoped to the
# current Alice registration so the VM receives the API key she just loaded.
users:
  - name: alice
    profiles: [custom-inference]
    vaultPrefix: secret/data/hub/saw-alice/d2565216ccf6a6c0
    webSearch:
      enabled: false
    values:
      deployment: {mode: vm}


# Opt in only for users of a configured custom-inference endpoint. Match
# the hostname in overrides/governance-profiles/custom-inference.yaml.
defaults:
  openshellSaw:
    egress:
      extraAllow:
        - api.enmaas.devshift.net
