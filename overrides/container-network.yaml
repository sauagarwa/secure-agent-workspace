containerDefaults:
  stack:
    gateway:
      values:
        oidc:
          issuerUrl: https://openshell-keycloak-ingress-saw-keycloak.apps.cluster-2lmvl.dyn.redhatworkshops.io/realms/openshell
        kubernetes:
          network:
            gatewayEgress:
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: openshell-agents
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: governance-interceptor
              ports:
              - protocol: TCP
                port: 18081
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: '@TRUSTED@'
                podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: '@OWNER@'
                    openshell.pattern/role: credential-proxy
              ports:
              - protocol: TCP
                port: 3128
            - to:
              - ipBlock:
                  cidr: 10.10.10.10/32
              ports:
              - protocol: TCP
                port: 6443
            - to:
              - ipBlock:
                  cidr: 10.10.10.11/32
              ports:
              - protocol: TCP
                port: 6443
            - to:
              - ipBlock:
                  cidr: 10.10.10.12/32
              ports:
              - protocol: TCP
                port: 6443
            - to:
              - ipBlock:
                  cidr: 172.231.0.1/32
              ports:
              - protocol: TCP
                port: 443
            - to:
              - ipBlock:
                  cidr: 172.231.0.10/32
              ports:
              - protocol: TCP
                port: 53
              - protocol: UDP
                port: 53
            - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: openshift-dns
                podSelector:
                  matchLabels:
                    dns.operator.openshift.io/daemonset-dns: default
              ports:
              - protocol: TCP
                port: 5353
              - protocol: UDP
                port: 5353
            - to:
              - ipBlock:
                  cidr: 10.10.10.101/32
              ports:
              - protocol: TCP
                port: 443
          storage:
            className: ocs-external-storagecluster-ceph-rbd
    proxy:
      values:
        network:
          bootstrapEgress:
          - to:
            - ipBlock:
                cidr: 10.10.10.10/32
            ports:
            - protocol: TCP
              port: 6443
          - to:
            - ipBlock:
                cidr: 10.10.10.11/32
            ports:
            - protocol: TCP
              port: 6443
          - to:
            - ipBlock:
                cidr: 10.10.10.12/32
            ports:
            - protocol: TCP
              port: 6443
          - to:
            - ipBlock:
                cidr: 172.231.0.1/32
            ports:
            - protocol: TCP
              port: 443
          - to:
            - ipBlock:
                cidr: 172.231.0.10/32
            ports:
            - protocol: TCP
              port: 53
            - protocol: UDP
              port: 53
          - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: openshift-dns
              podSelector:
                matchLabels:
                  dns.operator.openshift.io/daemonset-dns: default
            ports:
            - protocol: TCP
              port: 5353
            - protocol: UDP
              port: 5353
    audit:
      values:
        storageClass: ocs-external-storagecluster-ceph-rbd
        exchangeStorageClass: ocs-external-storagecluster-cephfs
  automaticEnrollment:
    relay:
      issuer: https://openshell-keycloak-ingress-saw-keycloak.apps.cluster-2lmvl.dyn.redhatworkshops.io/realms/openshell
      egress:
      - to:
        - ipBlock:
            cidr: 10.10.10.10/32
        ports:
        - protocol: TCP
          port: 6443
      - to:
        - ipBlock:
            cidr: 10.10.10.11/32
        ports:
        - protocol: TCP
          port: 6443
      - to:
        - ipBlock:
            cidr: 10.10.10.12/32
        ports:
        - protocol: TCP
          port: 6443
      - to:
        - ipBlock:
            cidr: 172.231.0.1/32
        ports:
        - protocol: TCP
          port: 443
      - to:
        - ipBlock:
            cidr: 172.231.0.10/32
        ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
      - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
        ports:
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 5353
      - to:
        - ipBlock:
            cidr: 10.10.10.101/32
        ports:
        - protocol: TCP
          port: 443
projection:
  egress:
