version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  brave_search:
    name: brave-search
    endpoints:
      - host: api.search.brave.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/curl
      - path: /usr/bin/node
      - path: /usr/local/bin/node
  tavily_search:
    name: tavily-search
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/curl
      - path: /usr/local/bin/curl
      - path: /usr/bin/node
      - path: /usr/local/bin/node
  gemini:
    name: gemini
    endpoints:
      - { host: generativelanguage.googleapis.com, port: 443 }
      - { host: "*-aiplatform.googleapis.com", port: 443 }
      - { host: cloudcode-pa.googleapis.com, port: 443 }
      - { host: accounts.google.com, port: 443 }
      - { host: oauth2.googleapis.com, port: 443 }
      - { host: www.googleapis.com, port: 443 }
      - { host: iamcredentials.googleapis.com, port: 443 }
    binaries:
      - { path: /usr/bin/gemini }
      - { path: /usr/lib/node_modules/@google/gemini-cli/dist/index.js }
      - { path: /usr/bin/node }

process:
  run_as_user: sandbox
  run_as_group: sandbox
