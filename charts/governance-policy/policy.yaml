version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  brave-search:
    name: Brave Search
    endpoints:
      - host: api.search.brave.com
        port: 443
        protocol: https
        access: read-only
        enforcement: enforce
  tavily-search:
    name: Tavily Search
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: https
        access: read-only
        enforcement: enforce

process:
  run_as_user: sandbox
  run_as_group: sandbox
