display_name: Brave Search
description: Brave Search API access for governed sandbox agents
category: web_search
credentials:
  - name: api_key
    description: Brave Search API key
    env_vars: [BRAVE_API_KEY]
    required: true
    auth_style: header
    header_name: X-Subscription-Token
discovery:
  credentials: [api_key]
endpoints:
  - host: api.search.brave.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
