apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata: {}
spec:
  providers:
    - name: nvidia
      type: nvidia
      nemoclawProvider: build
      # Default model; the `inference` Secret's `model` key overrides it.
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      modelSecretKey: model
      credentialSecret: inference
      credentialSecretKey: api_key
