apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: cuda-sandbox
      type: nemoclaw
      enabled: true
      agent: openclaw
      image: ghcr.io/validatedpatterns-sandbox/nemoclaw-sandbox:latest
      providers:
        - nvidia
      # The model the agent runs: the `inference` Secret's `model`, else
      # this default (the RHDH form pre-fills it).
      env:
        MODEL:
          secret: inference
          secretKey: model
          default: nvidia/nemotron-3.5-lightning-30b-a3b
          title: Model
      # The NemoClaw sandbox runs the OpenClaw gateway too: its control UI
      # gets its own route like the notebook's (see default/sandbox.yaml).
      ui:
        route: true
    - name: toolbox
      type: generic
      enabled: false
      image: base
      providers:
        - nvidia
