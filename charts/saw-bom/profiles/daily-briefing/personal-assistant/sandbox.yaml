apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: cuda-sandbox
      type: nemoclaw
      enabled: true
      agent: openclaw
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox:latest
      providers:
        - nvidia
        - slack
        - gmail
      # The daily-briefing harness bundle (charts/saw-bom/harness, CI also
      # publishes harness-bundles/daily-briefing as an image): the skill and
      # two MCP servers that read Slack and Gmail through the providers
      # above. Mounted read-only at /sandbox/harness; needs harnessEnabled on
      # the user. The installer creates this NemoClaw sandbox itself (with
      # the mount) instead of `nemoclaw onboard`. Asked to, the agent
      # schedules a briefing update every 5 minutes.
      harnessRef:
        name: daily-briefing
      # The sandbox is for this bundle: users of this profile get
      # harnessEnabled without asking (saw-users, the portal).
      harnessRequired: true
      # The NemoClaw sandbox runs the OpenClaw gateway too: its control UI
      # gets its own route like the notebook's (see default/sandbox.yaml).
      ui:
        route: true
