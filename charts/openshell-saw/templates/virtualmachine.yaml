{{- if .Values.openshellSaw.tenant.name }}{{- $cfg := .Values.openshellSaw }}{{- $ns := include "openshell-saw.namespace" $cfg }}{{- $i := $cfg.instance }}{{- $g := $cfg.guest }}{{- $r := $cfg.installerRelease }}{{- $p := $cfg.profileConfigMaps }}
{{- if and $g.enabled $i $r }}{{- $secrets := list }}{{- range $c := $cfg.tenant.credentials }}{{- $secrets = append $secrets (printf "saw-provider-%s" $c.name) }}{{- end }}{{- $profiles := list }}{{- range $cm := $p }}{{- $profiles = append $profiles $cm.name }}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: saw-guest, namespace: {{ $ns }}}
automountServiceAccountToken: false
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata: {name: {{ $cfg.tenant.name }}, namespace: {{ $ns }}, annotations: {argocd.argoproj.io/sync-options: Prune=false,Delete=false, argocd.argoproj.io/sync-wave: "10"}}
spec:
  runStrategy: {{ required "guest.runStrategy is required" $g.runStrategy }}
  template:
    spec:
      serviceAccountName: saw-guest
      domain:
        cpu: {cores: {{ required "guest.cores is required" $g.cores }}}
        resources: {requests: {memory: {{ printf "%vGi" (required "guest.memoryGi is required" $g.memoryGi) }}}}
        devices:
          autoattachPodInterface: true
          disks: [{name: rootdisk, disk: {bus: virtio}}, {name: cloudinit, disk: {bus: virtio}}]
          filesystems:
            - {name: saw-intent, virtiofs: {}}
            - {name: saw-installer, virtiofs: {}}
            {{- range $n, $_ := $p }}
            - {name: saw-profile-{{ $n }}, virtiofs: {}}
            {{- end }}{{- range $n, $_ := $secrets }}
            - {name: saw-secret-{{ $n }}, virtiofs: {}}
            {{- end }}
      networks: [{name: default, pod: {}}]
      volumes:
        - {name: rootdisk, dataVolume: {name: saw-root}}
        - name: cloudinit
          cloudInitNoCloud:
            userData: |-
              #cloud-config
              write_files: [{path: /etc/saw/guest.json, owner: root:root, permissions: '0600', content: {{ dict "namespace" $ns "instance" $cfg.tenant.name "enrollmentIdentity" (include "openshell-saw.identity" $cfg) "ownerSubject" $cfg.tenant.subject "profileConfigMaps" $profiles "providerSecrets" $secrets | toJson | quote }}]
              runcmd: [[systemctl, enable, saw-guest.service], [systemctl, --no-block, start, saw-guest.service]]
        - {name: saw-intent, configMap: {name: {{ printf "%s-intent" $cfg.tenant.name }}}}
        - {name: saw-installer, configMap: {name: {{ printf "%s-installer" $cfg.tenant.name }}}}
        {{- range $n, $cm := $p }}
        - {name: saw-profile-{{ $n }}, configMap: {name: {{ $cm.name }}}}
        {{- end }}{{- range $n, $name := $secrets }}
        - {name: saw-secret-{{ $n }}, secret: {secretName: {{ $name }}}}
        {{- end }}
{{- end }}{{- end }}
