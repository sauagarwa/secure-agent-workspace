{{- include "openshell-sandbox.validateSandboxName" (.Values.sandboxName | default .Release.Name) }}
{{- if ne .Values.containerRuntime "podman" }}
{{- fail "containerRuntime: the in-guest installer supports podman only" }}
{{- end }}
{{- $secrets := include "openshell-sandbox.providerSecrets" . | fromJsonArray }}
{{- range $secrets }}{{- include "openshell-sandbox.validateSecretName" . }}{{- end }}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
    openshell.pattern/role: gateway
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: {{ include "openshell-sandbox.fullname" . }}-root
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        {{- if .Values.source.registryURL }}
        source:
          registry:
            url: {{ .Values.source.registryURL | quote }}
            pullMethod: node
        {{- else if .Values.source.httpURL }}
        source:
          http:
            url: {{ .Values.source.httpURL | quote }}
        {{- else }}
        sourceRef:
          kind: DataSource
          name: {{ include "openshell-sandbox.dataSourceName" . }}
          namespace: {{ include "openshell-sandbox.goldenNamespace" . }}
        {{- end }}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.vm.diskSize }}
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
        openshell.pattern/role: gateway
      annotations:
        # Input changes (BOM, installer, cloud-init) change the VM spec, so
        # KubeVirt flags the VM RestartRequired. The disks are read at boot.
        openshell.pattern/installer-checksum: {{ include (print $.Template.BasePath "/configmap-installer.yaml") . | sha256sum | trunc 16 | quote }}
        openshell.pattern/cloudinit-checksum: {{ include (print $.Template.BasePath "/secret-cloudinit.yaml") . | sha256sum | trunc 16 | quote }}
    spec:
      domain:
        cpu:
          cores: {{ .Values.vm.cores }}
        resources:
          requests:
            memory: {{ .Values.vm.memory }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: saw-installer
              serial: saw-installer
              disk:
                bus: virtio
            - name: saw-profiles
              serial: saw-profiles
              disk:
                bus: virtio
            {{- range $i, $name := $secrets }}
            - name: saw-sec-{{ $i }}
              serial: saw-sec-{{ $i }}
              disk:
                bus: virtio
            {{- end }}
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: gateway
                  port: 17670
                  protocol: TCP
                - name: dashboard
                  port: 18789
                  protocol: TCP
                - name: webui
                  port: 8080
                  protocol: TCP
                - name: ssh
                  port: 22
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
          smm: {}
      {{- if .Values.vm.readinessProbe }}
      readinessProbe:
        exec:
          command: ["test", "-f", "/var/lib/saw/ready"]
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      {{- end }}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ include "openshell-sandbox.fullname" . }}-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: {{ include "openshell-sandbox.fullname" . }}-cloudinit
        - name: saw-installer
          configMap:
            name: {{ include "openshell-sandbox.fullname" . }}-installer
        - name: saw-profiles
          configMap:
            name: saw-bom-profiles
            optional: true
        {{- range $i, $name := $secrets }}
        - name: saw-sec-{{ $i }}
          secret:
            secretName: {{ $name }}
            optional: true
        {{- end }}
