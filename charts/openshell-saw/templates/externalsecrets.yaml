{{- if .Values.openshellSaw.tenant.name }}{{- $cfg := .Values.openshellSaw }}{{- $vault := $cfg.platform.vault }}{{- $ns := include "openshell-saw.namespace" $cfg }}{{- range $c := $cfg.tenant.credentials }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: saw-provider-{{ $c.name }}, namespace: {{ $ns }}}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef: {name: saw-user-vault, kind: SecretStore}
  target:
    name: saw-provider-{{ $c.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        {{- range $key, $property := $c.properties }}
        {{ $key }}: {{ printf "{{ .%s }}" $property | quote }}
        {{- end }}
  dataFrom: [{extract: {key: {{ printf "%s/%s/providers/%s" $vault.prefix (include "openshell-saw.identity" $cfg) $c.remoteKey | quote }}}}]
{{- end }}{{- end }}
