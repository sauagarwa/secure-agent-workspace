apiVersion: v1
kind: ServiceAccount
metadata:
  name: rh-forge-ui
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: rh-forge-ui
    app.kubernetes.io/component: forge-ui
    component: ui-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rh-forge-ui
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: rh-forge-ui
    app.kubernetes.io/component: forge-ui
    component: ui-only
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rh-forge-ui
      app.kubernetes.io/component: forge-ui
      component: ui-only
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rh-forge-ui
        app.kubernetes.io/component: forge-ui
        component: ui-only
    spec:
      serviceAccountName: rh-forge-ui
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rh-forge-ui
          image: image-registry.openshift-image-registry.svc:5000/${NS}/rh-forge-ui:demo1
          imagePullPolicy: Always
          ports:
            - name: ui-http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: ui-http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: ui-http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: rh-forge-ui
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: rh-forge-ui
    app.kubernetes.io/component: forge-ui
    component: ui-only
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rh-forge-ui
    app.kubernetes.io/component: forge-ui
    component: ui-only
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: ui-http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rh-forge-ui
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: rh-forge-ui
    app.kubernetes.io/component: forge-ui
    component: ui-only
spec:
  host: rh-forge-ui.${NS}.dal.dev.cirrus.ibm.com
  to:
    kind: Service
    name: rh-forge-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
