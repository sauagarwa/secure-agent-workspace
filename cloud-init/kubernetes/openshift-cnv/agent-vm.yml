apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: saw-agent
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-agent
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saw-agent
    spec:
      domain:
        cpu:
          cores: 4
        resources:
          requests:
            memory: 8Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: credentials
              disk:
                bus: virtio
              serial: SAWCREDS
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: userport
                  port: 18789
                  protocol: TCP
                - name: forgeui
                  port: 18090
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: saw-agent-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: saw-agent
              users:
                - default
                - name: openshell
                  gecos: OpenShell service account
                  lock_passwd: true
                  shell: /bin/bash
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  groups: wheel
                  ssh_authorized_keys:
                    - ${SSH_PUBKEY}
              packages:
                - podman
                - python3
                - python3-pip
                - python3-pyyaml
              runcmd:
                - |
                  set -euo pipefail
                  INSTALLER_IMAGE="${INSTALLER_IMAGE}"

                  # Pull and extract installer image so boot.sh is available
                  echo "[saw-init] Pulling installer: ${INSTALLER_IMAGE}"
                  podman pull "${INSTALLER_IMAGE}"
                  CID=$(podman create "${INSTALLER_IMAGE}")
                  podman cp "${CID}:/opt/saw-installer" /opt/saw-installer
                  podman rm "${CID}"
                  chmod +x /opt/saw-installer/*.sh /opt/saw-installer/lib/*.sh

                  # boot.sh owns all further logging to /var/log/saw-cloud-init.log
                  exec /opt/saw-installer/boot.sh "${INSTALLER_IMAGE}"
              final_message: "saw-agent cloud-init finished"
        - name: credentials
          secret:
            secretName: saw-agent-credentials
  dataVolumeTemplates:
    - metadata:
        name: saw-agent-root
      spec:
        source:
          http:
            url: "${BASE_IMAGE_URL}"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
