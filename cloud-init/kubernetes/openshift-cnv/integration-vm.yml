apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: saw-integration
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-integration
spec:
  running: true
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saw-integration
    spec:
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: credentials
              disk:
                bus: virtio
              serial: SAWCREDS
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                  protocol: TCP
                - name: gmail-read
                  port: 18080
                  protocol: TCP
                - name: gmail-write
                  port: 18081
                  protocol: TCP
                - name: m365-read
                  port: 18082
                  protocol: TCP
                - name: inference
                  port: 18083
                  protocol: TCP
                - name: slack-read
                  port: 18084
                  protocol: TCP
                - name: slack-write
                  port: 18085
                  protocol: TCP
                - name: m365-write
                  port: 18086
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: saw-integration-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: saw-integration
              users:
                - default
                - name: openshell
                  gecos: OpenShell service account
                  lock_passwd: true
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - ${SSH_PUBKEY}
              packages:
                - podman
                - python3
                - python3-pip
                - python3-pyyaml
              runcmd:
                - |
                  set -eu
                  # Mount credentials secret disk
                  mkdir -p /etc/saw/secrets
                  for i in $(seq 1 30); do
                    [ -b /dev/disk/by-id/virtio-SAWCREDS ] && break
                    sleep 1
                  done
                  mount -o ro /dev/disk/by-id/virtio-SAWCREDS /etc/saw/secrets
                  # Pull installer image and extract to host
                  podman pull "${INSTALLER_IMAGE}"
                  CID=$(podman create "${INSTALLER_IMAGE}")
                  podman cp "$CID:/opt/saw-installer" /opt/saw-installer
                  podman rm "$CID"
                  chmod +x /opt/saw-installer/install-bom.sh /opt/saw-installer/lib/*.sh
                  # Build credentials.env from mounted secret files
                  for f in /etc/saw/secrets/*; do
                    [ -f "$f" ] || continue
                    key=$(basename "$f" | tr '[:lower:]-' '[:upper:]_')
                    echo "${key}=$(cat "$f")" >> /etc/saw/credentials.env
                  done
                  chmod 600 /etc/saw/credentials.env
                  # Install and enable the BOM installer systemd service
                  cp /opt/saw-installer/saw-bom-install.service /etc/systemd/system/
                  systemctl daemon-reload
                  systemctl enable --now saw-bom-install.service
        - name: credentials
          secret:
            secretName: saw-integration-credentials
  dataVolumeTemplates:
    - metadata:
        name: saw-integration-root
      spec:
        source:
          http:
            url: "${BASE_IMAGE_URL}"
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 40Gi
