apiVersion: cirrus.ibm.com/v1alpha1
kind: Server
metadata:
  name: saw-integration
  namespace: ${NS}
  labels:
    app.kubernetes.io/name: secure-agent-workspace
    app.kubernetes.io/component: saw-integration
spec:
  cloudInit:
    userData: |
      #cloud-config
      hostname: saw-integration
      users:
        - default
        - name: openshell
          gecos: OpenShell service account
          lock_passwd: true
          shell: /bin/bash
      runcmd:
        - |
          set -eu
          install -d -m 0750 /etc/openshell-saw
          vars_device=""
          for attempt in 1 2 3 4 5; do
            vars_device="$(lsblk -rpno NAME,SERIAL | awk '$2=="VARS01"{print $1;exit}')"
            if [ -n "${vars_device}" ]; then break; fi
            sleep 10
          done
          test -n "${vars_device}"
          mount "${vars_device}" /etc/openshell-saw
          checkout=/opt/secure-agent-workspace
          install -d -m 0755 "${checkout}"
          curl -fsSL --retry 5 --retry-delay 10 \
            https://github.com/rh-forge/secure-agent-workspace/archive/refs/heads/${BRANCH:-main}.tar.gz \
            | tar -xz --strip-components=1 -C "${checkout}"
          systemd-run --unit=saw-provision.service --setenv=HOME=/root \
            /usr/bin/bash -c 'exec /usr/bin/ansible-playbook -i localhost, \
            /opt/secure-agent-workspace/cloud-init-new/ansible/integ.yml \
            -e @/etc/openshell-saw/vars.yml \
            > /var/log/saw-provision.log 2>&1'
  containerDiskImage: ${CONTAINER_DISK_IMAGE:-registry.cirrus.ibm.com/mici-golden-images/cirrus-rhel-9-golden-image:latest}
  operatingSystem: ""
  profile: c1.m4
  running: true
  ports:
    - name: gmail-read
      port: 18080
      protocol: TCP
    - name: gmail-write
      port: 18081
      protocol: TCP
    - name: m365-read
      port: 18082
      protocol: TCP
    - name: inference
      port: 18083
      protocol: TCP
    - name: slack-read
      port: 18084
      protocol: TCP
    - name: slack-write
      port: 18085
      protocol: TCP
    - name: m365-write
      port: 18086
      protocol: TCP
  mounts:
    - name: vars-secret
      serial: VARS01
      volume:
        secret:
          secretName: saw-integration-vars
    - name: persistent-state
      serial: SAWINTEGPERSIST
      volume:
        persistentVolumeClaim:
          claimName: saw-integration-persist
          readOnly: false
