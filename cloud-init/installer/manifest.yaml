apiVersion: saw.redhat.com/v1alpha1
kind: VmBom
metadata:
  name: saw-agent-bom
  version: v0.1.0
  createdAt: "2026-08-24T00:00:00Z"

spec:
  role: agent

  platform:
    os: fedora
    arch: amd64
    runtime: podman

  artifacts:
    openshell:
      cli:
        source:
          type: pip
          package: openshell
          version: "0.0.110"
          extraIndexUrl: ""
      gateway:
        source:
          type: image_binary
          image: "ghcr.io/nvidia/openshell/gateway:0.0.110"
          pathInImage: "/usr/local/bin/openshell-gateway"
      supervisor:
        source:
          type: image_binary
          image: "ghcr.io/nvidia/openshell/supervisor:0.0.110"
          pathInImage: "/openshell-sandbox"

  system:
    user: ""
    installPaths:
      gatewayBin: /usr/local/bin/openshell-gateway
      supervisorBin: /usr/local/bin/openshell-supervisor
    packages:
      required:
        - podman
        - jq
        - lsof
        - python3
        - python3-pip
        - python3-pyyaml
    services:
      enable:
        - podman
    gatewayEnv:
      OPENSHELL_DRIVERS: podman
      OPENSHELL_SERVER_PORT: "17670"
      OPENSHELL_SSH_GATEWAY_PORT: "17670"

  bootstrap:
    gateway:
      name: openshell-local
      endpoint: "https://127.0.0.1:17670"
      authMode: mtls
      externallySupervised: true
    profiles:
      source: /opt/saw-installer/profiles
      role: forge-agent

  security:
    verifyChecksums: false
    denyLatestTags: false

  verify:
    commands:
      - "openshell --version"
      - "openshell-gateway --version"
      - "systemctl --user is-active openshell-gateway.service"
      - "podman --version"

  report:
    writeJson: /var/log/saw-bom-install-report.json
    writeText: /var/log/saw-bom-install-report.txt
